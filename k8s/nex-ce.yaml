# Nex CE node for the Synadia Platform trial, running Kubernetes-native.
#
# These are plain manifests, not the synadia/nex-ce chart. The chart (0.1.4 /
# appVersion 0.1.8) renders its own config.json and has no way to set the
# `platform` or `catalog` blocks, which the trial needs so the node registers
# with Control Plane and serves the connector catalog. It also pins an older
# image and mis-wires its namespace values. Owning the config Secret here keeps
# the trial in charge of what it already generates with jq.
#
# scripts/start-k8s.sh renders nex-ce.config.json from
# nex-ce.config.json.template and creates the nex-config Secret from it.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: nex
  namespace: NEX_NAMESPACE
  labels:
    app.kubernetes.io/name: nex-ce
---
# Workloads land in their own namespace so trial workloads stay separate from
# the platform components.
apiVersion: v1
kind: Namespace
metadata:
  name: nex-workloads
  labels:
    app.kubernetes.io/name: nex-ce
---
# Mirrors the role from the synadia/nex-ce chart, scoped to the workloads
# namespace where Nex creates things.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: nex-role
  namespace: nex-workloads
  labels:
    app.kubernetes.io/name: nex-ce
rules:
  - apiGroups: [""]
    resources:
      - services
      - serviceaccounts
      - persistentvolumeclaims
      - configmaps
      - secrets
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources:
      - pods
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources:
      - pods/log
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources:
      - events
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources:
      - replicasets
      - deployments
      - statefulsets
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["batch"]
    resources:
      - jobs
      - cronjobs
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["networking.k8s.io"]
    resources:
      - ingresses
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources:
      - roles
      - rolebindings
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["metrics.k8s.io"]
    resources:
      - pods
      - nodes
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: nex-rolebinding
  namespace: nex-workloads
  labels:
    app.kubernetes.io/name: nex-ce
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: nex-role
subjects:
  - kind: ServiceAccount
    name: nex
    namespace: NEX_NAMESPACE
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nex
  namespace: NEX_NAMESPACE
  labels:
    app.kubernetes.io/name: nex-ce
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: nex-ce
  template:
    metadata:
      labels:
        app.kubernetes.io/name: nex-ce
      annotations:
        # Restart the node when the rendered config changes
        checksum/config: CONFIG_CHECKSUM
    spec:
      serviceAccountName: nex
      imagePullSecrets:
        - name: synadia-registry
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: nex-ce
          image: registry.synadia.io/nexce:0.3.1
          imagePullPolicy: IfNotPresent
          # Kong loads /etc/nex-ce/config.json automatically (cmd/main.go:45),
          # so the config path is a mount location, not a flag.
          args:
            - node
            - up
          env:
            # Seed the embedded connector catalog, matching the Compose trial
            - name: YES_SEED
              value: "1"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: config
              mountPath: /etc/nex-ce
              readOnly: true
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
      volumes:
        - name: config
          secret:
            secretName: nex-config
