name: Test Scripts

on:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Test Compose (${{ matrix.engine }}${{ matrix.nex && ', nex' || '' }})
    timeout-minutes: 15
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        engine: [docker, podman]
        nex: [false, true]
    env:
      BRANCH: ${{ github.head_ref || github.ref_name }}
      ENGINE: ${{ matrix.engine }}
      NEX: ${{ matrix.nex }}
    steps:
      # Nex generates its node seed with `nk`
      - name: Install nk
        if: matrix.nex
        shell: bash
        run: |
          go install github.com/nats-io/nkeys/nk@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      # `podman compose` needs a compose provider on the runner
      - name: Install podman-compose
        if: matrix.engine == 'podman'
        shell: bash
        run: |
          pipx install podman-compose
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Test bootstrap.sh
        env:
          SYNADIA_CR_USERNAME: ${{ secrets.SYNADIA_CR_USERNAME }}
          SYNADIA_CR_PASSWORD: ${{ secrets.SYNADIA_CR_PASSWORD }}
        shell: bash
        run: |
          # Nex (any engine) and the podman engine need the rootless podman
          # socket running; start it in the background for this job.
          if [ "$NEX" = "true" ] || [ "$ENGINE" = "podman" ]; then
            podman system service --time=0 &
            for _ in $(seq 1 10); do podman info >/dev/null 2>&1 && break; sleep 1; done
          fi

          args=(--branch "$BRANCH")
          [ "$ENGINE" = "podman" ] && args+=(--podman)
          [ "$NEX" = "true" ] && args+=(--nex)

          curl -fsSL "https://raw.githubusercontent.com/synadia-io/platform-trial/refs/heads/${BRANCH}/scripts/bootstrap.sh" \
            | bash -s -- "${args[@]}"

      - name: Test
        shell: bash
        working-directory: platform-trial
        run: ./scripts/test.sh

      - name: Stop
        shell: bash
        working-directory: platform-trial
        run: ./scripts/stop.sh ${{ matrix.engine == 'podman' && '--podman' || '' }}

      - name: Debug
        if: failure()
        working-directory: platform-trial
        shell: bash
        run: |
          set +e
          echo 'shared.conf:'; cat shared.conf
          if [ "$NEX" = "true" ]; then
            echo; echo 'nex-ce.config.json:'; cat nex-ce.config.json
            echo; echo 'nex logs:'; ${ENGINE} compose logs nex
          fi

  test-k8s:
    name: Test Kubernetes (kind${{ matrix.nex && ', nex' || '' }})
    timeout-minutes: 30
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        nex: [false, true]
    env:
      NEX: ${{ matrix.nex }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install nk
        if: matrix.nex
        shell: bash
        run: |
          go install github.com/nats-io/nkeys/nk@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Test start-k8s.sh
        env:
          SYNADIA_CR_USERNAME: ${{ secrets.SYNADIA_CR_USERNAME }}
          SYNADIA_CR_PASSWORD: ${{ secrets.SYNADIA_CR_PASSWORD }}
        shell: bash
        run: ./scripts/start-k8s.sh ${{ matrix.nex && '--nex' || '' }}

      - name: Test
        shell: bash
        run: ./scripts/test.sh

      - name: Stop
        shell: bash
        run: ./scripts/stop-k8s.sh

      - name: Debug
        if: failure()
        shell: bash
        run: |
          set +e
          kc() { kubectl --context kind-platform-trial --namespace platform-trial "$@"; }

          # A failure early in start-k8s.sh leaves later resources uncreated, so
          # log each one only when it exists. Otherwise kubectl's NotFound hides
          # the logs of the component that actually broke.
          dump_logs() {
            echo; echo "$1 logs:"
            kc get "$1" >/dev/null 2>&1 \
              && kc logs "$1" --tail=100 \
              || echo "  ($1 not found)"
          }

          kc get pods -o wide
          kc get events --sort-by=.lastTimestamp | tail -50
          dump_logs deployment/control-plane
          dump_logs statefulset/nats
          dump_logs deployment/http-gateway
          if [ "$NEX" = "true" ]; then
            dump_logs deployment/nex
            echo; echo 'workload pods:'
            kubectl --context kind-platform-trial --namespace nex-workloads get pods -o wide
          fi
